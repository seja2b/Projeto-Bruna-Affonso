<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bruna Affonso - Personal Trainer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    :root {
      --primary-purple: #7c3aed;
      --primary-pink: #ec4899;
      --primary-orange: #f97316;
      --primary-red: #ef4444;
      --primary-green: #22c55e;
      --dark-bg: #0f172a;
      --dark-card: #1a1a2e;
      --text-white: #ffffff;
      --text-gray: #d1d5db;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: white;
      color: #1f2937;
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    section {
      padding: 4rem 0;
    }

    h1, h2, h3 {
      font-weight: 700;
      line-height: 1.2;
    }

    h1 { font-size: 3.5rem; margin: 1rem 0; }
    h2 { font-size: 2.5rem; margin: 1.5rem 0 1rem; }
    h3 { font-size: 1.25rem; margin: 0.5rem 0; }

    p { margin-bottom: 1rem; }

    .btn {
      display: inline-block;
      padding: 12px 32px;
      background: var(--primary-green);
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.3s;
      text-decoration: none;
      text-align: center;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(34, 197, 94, 0.3);
    }

    .btn-block {
      width: 100%;
      display: block;
    }

    /* LOGIN / AUTENTICAÇÃO */
    #login-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
    }
    
    .login-container {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      max-width: 400px;
      width: 90%;
    }
    
    .login-container h2 {
      margin-bottom: 1.5rem;
      color: #0f172a;
    }
    
    .login-container input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 1rem;
    }
    
    .login-container input:focus {
      outline: none;
      border-color: var(--primary-purple);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
    }
    
    .login-buttons {
      display: flex;
      gap: 1rem;
    }
    
    .login-buttons button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
    }
    
    .btn-login {
      background: var(--primary-purple);
      color: white;
    }
    
    .btn-login:hover {
      background: #6d28d9;
    }
    
    .btn-cancel {
      background: #e5e7eb;
      color: #666;
    }
    
    .btn-cancel:hover {
      background: #d1d5db;
    }
    
    .login-message {
      color: #ef4444;
      font-size: 0.875rem;
      margin-bottom: 1rem;
      text-align: center;
    }
    
    .login-success {
      color: var(--primary-green);
    }
    
    .user-info {
      font-size: 0.875rem;
      color: #666;
    }
    
    .btn-logout {
      background: #ef4444;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 600;
    }
    
    .btn-logout:hover {
      background: #dc2626;
    }

    /* HERO */
    #hero {
      text-align: center;
      padding: 5rem 0;
      background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
    }

    .hero-subtitle {
      font-size: 0.875rem;
      color: #999;
      letter-spacing: 1px;
      margin-bottom: 1rem;
    }

    .hero-title-wrapper {
      line-height: 1.3;
      margin: 1rem 0;
    }
    
    .hero-title-line1 {
      font-size: 2.5rem;
      font-weight: 700;
      color: #0f172a;
      display: block;
      margin: 0 0 0.5rem 0;
    }
    
    .hero-title-line2 {
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(90deg, var(--primary-purple) 0%, var(--primary-pink) 50%, var(--primary-orange) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: block;
      margin: 0;
    }

    .highlight-text {
      background: linear-gradient(90deg, var(--primary-purple) 0%, var(--primary-pink) 50%, var(--primary-orange) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* SOCIAL PROOF */
    .proof-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
      margin: 2rem 0;
    }

    .proof-card {
      background: var(--dark-card);
      border-radius: 16px;
      padding: 2rem;
      color: var(--text-white);
      transition: transform 0.3s;
    }

    .proof-card:hover {
      transform: translateY(-5px);
    }

    .proof-card-title {
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .proof-card-desc {
      font-size: 0.875rem;
      color: var(--text-gray);
      margin-bottom: 1rem;
      line-height: 1.6;
    }

    .proof-card-footer {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      padding-top: 1rem;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .proof-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-purple), var(--primary-pink));
    }

    /* DIFERENCIAIS */
    .diferenciais-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 2rem;
      margin: 2rem 0;
    }

    .diferencial-card {
      background: white;
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
      border: 2px solid #f0f0f0;
      transition: all 0.3s;
    }

    .diferencial-card:nth-child(1) {
      border-color: #fce7f3;
      background: linear-gradient(135deg, #fce7f3 0%, white 100%);
    }

    .diferencial-card:nth-child(2) {
      border-color: #fed7aa;
      background: linear-gradient(135deg, #fed7aa 0%, white 100%);
    }

    .diferencial-card:nth-child(3) {
      border-color: #fecdd3;
      background: linear-gradient(135deg, #fecdd3 0%, white 100%);
    }

    .diferencial-icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .diferencial-text {
      font-weight: 600;
      font-size: 1rem;
    }

    /* COMO FUNCIONA */
    #funciona {
      background: var(--dark-bg);
      padding: 4rem 0;
    }

    #funciona h2 {
      color: white;
      text-align: center;
    }

    .funciona-subtitle {
      text-align: center;
      color: var(--text-gray);
      margin-bottom: 2rem;
    }

    .steps-container {
      display: grid;
      gap: 2rem;
      margin: 2rem 0;
    }

    .step-card {
      background: white;
      border-radius: 12px;
      padding: 2rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      align-items: center;
    }

    .step-card:nth-child(even) {
      direction: rtl;
    }

    .step-card:nth-child(even) > * {
      direction: ltr;
    }

    .step-badge {
      display: inline-block;
      background: var(--primary-purple);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .step-title {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .step-desc {
      color: #666;
      margin-bottom: 1rem;
    }

    .step-checks {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .check-item {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      font-size: 0.875rem;
    }

    .check-icon {
      color: var(--primary-green);
      font-weight: bold;
    }

    .step-image {
      width: 100%;
      height: 250px;
      background: linear-gradient(135deg, var(--primary-purple), var(--primary-pink));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
    }

    /* PERSONAS */
    .personas-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      margin: 2rem 0;
    }

    .persona-card {
      background: var(--dark-card);
      border-radius: 12px;
      padding: 1.5rem;
      color: var(--text-white);
      display: flex;
      gap: 1rem;
      align-items: flex-start;
    }

    .persona-check {
      color: var(--primary-green);
      font-size: 1.25rem;
      flex-shrink: 0;
      margin-top: 0.25rem;
    }

    .persona-text {
      font-size: 0.95rem;
      line-height: 1.5;
    }

    /* BONUS */
    #bonus {
      background: white;
    }

    .bonus-cards {
      display: grid;
      gap: 1.5rem;
      margin: 2rem 0;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }

    .bonus-card {
      background: var(--dark-card);
      border-radius: 12px;
      padding: 1.5rem;
      color: var(--text-white);
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 1.5rem;
      align-items: center;
    }

    .bonus-badge {
      display: inline-block;
      background: var(--primary-purple);
      color: white;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .bonus-title {
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .bonus-desc {
      font-size: 0.875rem;
      color: var(--text-gray);
      margin-bottom: 0.5rem;
    }

    .bonus-value {
      font-size: 0.8rem;
      color: #999;
    }

    .bonus-image {
      width: 100%;
      height: 150px;
      background: linear-gradient(135deg, var(--primary-orange), var(--primary-red));
      border-radius: 8px;
    }

    /* PRECO */
    #preco {
      background: #f9fafb;
    }

    .price-recap {
      background: white;
      border-radius: 12px;
      padding: 2rem;
      margin: 2rem auto;
      max-width: 600px;
      border: 1px solid #e5e7eb;
    }

    .price-table {
      width: 100%;
      margin-bottom: 1.5rem;
    }

    .price-table td {
      padding: 0.75rem 0;
      border-bottom: 1px solid #e5e7eb;
      font-size: 0.875rem;
    }

    .price-table td:last-child {
      text-align: right;
      color: var(--primary-red);
      font-weight: 600;
    }

    .price-table tr:last-child td {
      border-bottom: 2px solid #000;
      font-weight: 700;
      padding: 1rem 0;
    }

    /* GARANTIA */
    .guarantee-badge {
      background: white;
      border: 2px solid var(--primary-purple);
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
      margin: 2rem auto;
      max-width: 500px;
    }

    .guarantee-seal {
      width: 100px;
      height: 100px;
      margin: 0 auto 1rem;
      background: linear-gradient(135deg, var(--primary-purple), var(--primary-pink));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 2rem;
      font-weight: bold;
    }

    .guarantee-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .guarantee-text {
      color: #666;
      font-size: 0.875rem;
      line-height: 1.6;
    }

    /* FAQ */
    #faq {
      background: var(--dark-bg);
    }

    #faq h2 {
      color: white;
      text-align: center;
    }

    .faq-container {
      max-width: 700px;
      margin: 2rem auto;
    }

    .faq-item {
      background: var(--dark-card);
      border-radius: 8px;
      margin-bottom: 1rem;
      overflow: hidden;
    }

    .faq-question {
      padding: 1.5rem;
      background: var(--dark-card);
      color: var(--text-white);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      user-select: none;
      transition: all 0.3s;
    }

    .faq-question:hover {
      background: #2a2a3e;
    }

    .faq-toggle {
      color: var(--primary-green);
      font-size: 1.25rem;
    }

    .faq-answer {
      padding: 0;
      max-height: 0;
      overflow: hidden;
      background: rgba(255,255,255,0.05);
      transition: all 0.3s;
    }

    .faq-answer.active {
      padding: 1.5rem;
      max-height: 500px;
    }

    .faq-answer-text {
      color: var(--text-gray);
      font-size: 0.875rem;
      line-height: 1.6;
      font-weight: 400;
    }

    /* CRIADOR */
    #creator {
      background: var(--dark-bg);
      color: var(--text-white);
    }

    #creator h2 {
      color: white;
      text-align: center;
    }

    .creator-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      align-items: center;
      margin: 2rem 0;
      max-width: 1000px;
      margin-left: auto;
      margin-right: auto;
    }

    .creator-info h3 {
      color: white;
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .creator-desc {
      color: var(--text-gray);
      margin-bottom: 1.5rem;
    }

    .creator-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .creator-stat {
      text-align: center;
      background: rgba(255,255,255,0.05);
      padding: 1rem;
      border-radius: 8px;
    }

    .stat-number {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary-pink);
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-gray);
      margin-top: 0.25rem;
    }

    .creator-image {
      width: 100%;
      border-radius: 12px;
      object-fit: cover;
    }

    /* RODAPÉ */
    footer {
      background: var(--dark-bg);
      color: var(--text-white);
      padding: 2rem 0;
      text-align: center;
      font-size: 0.875rem;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    /* ADMIN PANEL */
    #admin-panel {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #f9fafb;
      z-index: 1000;
      overflow-y: auto;
    }

    .admin-header {
      background: white;
      padding: 2rem;
