name: Worker CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find src -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate Wrangler entrypoint
        shell: bash
        run: |
          set -euo pipefail
          MAIN=$(sed -nE 's/^main[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' wrangler.toml | head -n1)
          test -n "$MAIN"
          test -f "$MAIN"
          echo "Entrypoint validado: $MAIN"
